version: 1
default_environment: prod
project_id: aabbc9fd-e40c-4c59-8260-53f608432fe8
environments:
- name: dev
- name: staging
  config:
    plugins:
      transformers:
      - name: dbt-bigquery
        env:
          DBT_BIGQUERY_PROJECT: together-internal
          DBT_BIGQUERY_LOCATION: australia-southeast1
          REFERENCE_META_BIGQUERY_DATASET: dbt_test_facebook
          REFERENCE_META_TRANSFORMED_BIGQUERY_DATASET: dbt_test_facebook
          REFERENCE_DV360_BIGQUERY_DATASET: dbt_test_dv360_raw
          REFERENCE_DV360_TRANSFORMED_BIGQUERY_DATASET: dbt_test_dv360
          REFERENCE_TIKTOK_BIGQUERY_DATASET: dbt_test_tiktok
          REFERENCE_TIKTOK_TRANSFORMED_BIGQUERY_DATASET: dbt_test_tiktok
          REFERENCE_CM360_BIGQUERY_DATASET: dbt_test_cm360
          REFERENCE_CM360_TRANSFORMED_BIGQUERY_DATASET: dbt_test_cm360
          REFERENCE_GOOGLE_ADS_BESTSTART_BIGQUERY_DATASET: dbt_test_google_ads_search
          REFERENCE_GOOGLE_ADS_HR_CAREER_BIGQUERY_DATASET: dbt_test_google_ads_search
          REFERENCE_GA4_RAW_BIGQUERY_DATASET: dbt_test_ga4_raw
          REFERENCE_GA4_TRANSFORMED_BIGQUERY_DATASET: dbt_test_ga4_transformed
          REFERENCE_DASH_TABLE_BESTSTART_BIGQUERY_DATASET: dbt_test_dash_table
          REFERENCE_DASH_TABLE_HR_CAREER_BIGQUERY_DATASET: dbt_test_dash_table
          REFERENCE_DASH_SEARCH_BESTSTART_BIGQUERY_DATASET: dbt_test_dash_table_search
          REFERENCE_DASH_SEARCH_HR_CAREER_BIGQUERY_DATASET: dbt_test_dash_table_search
          META_SUFFIX: dbt_test_facebook
          DV360_SUFFIX: dbt_test_dv360
          TIKTOK_SUFFIX: dbt_test_tiktok
          GOOGLE_ADS_SEARCH_SUFFIX: dbt_test_google_ads_search
          PLAN_CODE: uow
          REPORT_NAME: amp_report
- name: prod
#state_backend:
#  uri: gs://best-start-main-meltano-state-staging
plugins:
  extractors:
  - name: tap-linkedin-ads
    variant: singer-io
    pip_url: tap-linkedin-ads
    config:
      accounts: '510976905'
      user_agent: agent
      start_date: ${START_DATE}
  - name: tap-ga4
    variant: meltanolabs
    pip_url: git+https://github.com/MeltanoLabs/tap-google-analytics.git setuptools<82.0
    config:
      reports: ${TAP_GA4_REPORTS}
      start_date: ${START_DATE}
      keep_empty_rows: true
      select:
      - ${GA4_GOAL}
  - name: tap-dv360
    namespace: tap-dv360
    pip_url: git+https://github.com/Together-NZ/tap-dv360.git setuptools<82.0
    executable: tap-dv360
    capabilities:
    - state
    - catalog
    - discover
    - about
    - stream-maps
    config:
      start_date: ${START_DATE}
      advertiser_id: '1288100549'
      query_standard: dv360_standard.json
      query_youtube: dv360_youtube.json
      service_account: together-meltano@together-internal.iam.gserviceaccount.com

  - name: tap-gpt
    namespace: tap-gpt
    pip_url: git+https://github.com/Together-NZ/tap-gpt.git setuptools<82.0
    executable: tap-gpt
    capabilities:
    - state
    - catalog
    - discover
    - about
    - stream-maps
    config:
      api_token: ${TAP_GPT_API_TOKEN}
      start_date: ${START_DATE}
      end_date: ${TAP_GPT_END_DATE}

  - name: tap-facebook
    variant: airbyte
    pip_url: git+https://github.com/MeltanoLabs/tap-airbyte-wrapper.git setuptools<82.0
    config:
      airbyte_config:
        start_date: ${START_DATE}T00:00:00Z
    select:
    - ads_insights.*
    - ad_account.*
    - ad_sets.*
    - ads.*
    - campaigns.*
    - custom_conversions.*
  - name: tap-tiktok
    variant: gthesheep
    pip_url: git+https://github.com/gthesheep/tap-tiktok.git setuptools<82.0
    config:
      start_date: ${START_DATE}
  loaders:
  - name: target-bigquery
    variant: z3z1ma
    pip_url: git+https://github.com/z3z1ma/target-bigquery.git setuptools<82.0
    config:
      dataset: ${BQ_DATASET}
      project: best-start-main
      location: australia-southeast1
      denormalized: false
      schema_resolver_version: 2
      column_name_transforms:
        add_underscore_when_invalid: true
        lower: true
        snake_case: true
      fail_fast: false
      method: ${BQ_METHOD}
      bucket: australia-southeast1-meltan-00c049c-bigquery-staging
  transformers:
  - name: dbt-bigquery
    variant: dbt-labs
    pip_url: dbt-core~=1.8.0 dbt-bigquery~=1.8.0 setuptools<82.0
    commands:
      gpt_models:
        args: run --select gpt
      google_ads_beststart_models:
        args: run --select google_ads_search__beststart google_ads_demand__beststart google_ads_demand2 google_ads_keyword__beststart google_ads_location__beststart
      google_ads_hr_career_models:
        args: run --select google_ads_search__hr_career google_ads_demand__hr_career google_ads_keyword__hr_career google_ads_location__hr_career
      dv360_models:
        args: run --select +dv360_standard +dv360_youtube
      cm360_models:
        args: run --select +cm360_seralized +cm360_direct_buy
      facebook_models:
        args: run --select +facebook
      tiktok_models:
        args: run --select +tiktok
      ga4_goal_models:
        args: run --select +ga4_goal_a +ga4_goal_channel_goal
      ga4_session_models:
        args: run --select +ga4_goal_a_session +ga4_goal_channel_session
      ga4_keyword_models:
        args: run --select ga4_goal_channel_keyword
      ga4_final_models:
        args: run --select ga4_goal_channel
elt:
  buffer_size: 52428800
