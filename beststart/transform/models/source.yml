version: 2

models:
  - name: facebook
    config:
      schema: "{{ env_var('META_SUFFIX', '') }}"
    columns:
      - name: media_cost
        tests:
          - testing_sum.expected_sum:
              expected_value: 14549.95
      - name: impressions
        tests:
          - testing_sum.expected_sum:
              expected_value: 2857616
      - name: clicks
        tests:
          - testing_sum.expected_sum:
              expected_value: 22450

  - name: tiktok
    config:
      schema: "{{ env_var('TIKTOK_SUFFIX', '') }}"
    columns:
      - name: media_cost
        tests:
          - testing_sum.expected_sum:
              expected_value: 1095.76
      - name: impressions
        tests:
          - testing_sum.expected_sum:
              expected_value: 429635
      - name: clicks
        tests:
          - testing_sum.expected_sum:
              expected_value: 1268

  - name: dv360_standard
    config:
      schema: "{{ env_var('DV360_SUFFIX', '') }}"
    columns:
      - name: media_cost
        tests:
          - testing_sum.expected_sum:
              expected_value: 68223.08
      - name: impressions
        tests:
          - testing_sum.expected_sum:
              expected_value: 5840202
      - name: clicks
        tests:
          - testing_sum.expected_sum:
              expected_value: 7786

  - name: dv360_youtube
    config:
      schema: "{{ env_var('DV360_SUFFIX', '') }}"
    columns:
      - name: media_cost
        tests:
          - testing_sum.expected_sum:
              expected_value: 67127.98
      - name: impressions
        tests:
          - testing_sum.expected_sum:
              expected_value: 5248537
      - name: clicks
        tests:
          - testing_sum.expected_sum:
              expected_value: 4432

sources:
  - name: ga4_raw
    database: "{{ env_var('DBT_BIGQUERY_PROJECT', 'best-start-main') }}"
    schema: "{{ env_var('REFERENCE_GA4_RAW_BIGQUERY_DATASET', 'ga4_raw') }}"
    tables:
      - name: goal
      - name: session_goal
      - name: keyword_goal

  - name: ga4_transformed
    database: "{{ env_var('DBT_BIGQUERY_PROJECT', 'best-start-main') }}"
    schema: "{{ env_var('REFERENCE_GA4_TRANSFORMED_BIGQUERY_DATASET', 'ga4_transformed') }}"
    tables:
      - name: ga4_goal_channel_goal
      - name: ga4_goal_channel_session

  - name: facebook_raw
