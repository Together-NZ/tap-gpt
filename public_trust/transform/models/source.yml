version: 2

# Public Trust (real-nz / public-trust-main). Override with DBT_BIGQUERY_PROJECT and REFERENCE_* env vars.

sources:
  - name: cm360_raw
    database: "together-internal"
    schema: "{{ env_var('REFERENCE_CM360_RAW_BIGQUERY_DATASET', 'cm360_raw') }}"
    tables:
      - name: cm360_report_stream
  - name: ga4_raw
    database: "{{ env_var('DBT_BIGQUERY_PROJECT', 'public-trust-main') }}"
    schema: "{{ env_var('REFERENCE_GA4_RAW_BIGQUERY_DATASET', 'ga4_raw') }}"
    tables:
      - name: goal
      - name: session_goal

  - name: facebook_raw
    database: "{{ env_var('DBT_BIGQUERY_PROJECT', 'public-trust-main') }}"
    schema: "{{ env_var('REFERENCE_META_BIGQUERY_DATASET', 'facebook_raw') }}"
    tables:
      - name: ads_insights
      - name: ad_sets
      - name: ads
      - name: campaigns
      - name: custom_conversions


  - name: facebook_raw_old
    database: "{{ env_var('DBT_BIGQUERY_PROJECT', 'public-trust-main') }}"
    schema: "{{ env_var('REFERENCE_META_OLD_BIGQUERY_DATASET', 'facebook_raw_old') }}"
    tables:
      - name: ads_insights
      - name: ad_sets
      - name: ads
      - name: campaigns
      - name: custom_conversions




  - name: dv360_raw
    database: "{{ env_var('DBT_BIGQUERY_PROJECT', 'public-trust-main') }}"
    schema: "{{ env_var('REFERENCE_DV360_BIGQUERY_DATASET', 'dv360_raw') }}"
    tables:
      - name: dv360_standard
      - name: dv360_youtube



  - name: ttd_raw
    database: "{{ env_var('DBT_BIGQUERY_PROJECT', 'public-trust-main') }}"
    schema: "{{ env_var('REFERENCE_TTD_BIGQUERY_DATASET', 'ttd_raw') }}"
    tables:
      - name: standard_streams



  - name: facebook_transformed
    database: "{{ env_var('DBT_BIGQUERY_PROJECT', 'public-trust-main') }}"
    schema: "{{ env_var('REFERENCE_META_TRANSFORMED_BIGQUERY_DATASET', 'facebook_transformed') }}"
    tables:
      - name: facebook

  - name: facebook_transformed_old
    database: "{{ env_var('DBT_BIGQUERY_PROJECT', 'public-trust-main') }}"
    schema: "{{ env_var('REFERENCE_META_TRANSFORMED_OLD_BIGQUERY_DATASET', 'facebook_transformed_old') }}"
    tables:
      - name: facebook_old


  - name: ttd_transformed
    database: "{{ env_var('DBT_BIGQUERY_PROJECT', 'public-trust-main') }}"
    schema: "{{ env_var('REFERENCE_TTD_TRANSFORMED_BIGQUERY_DATASET', 'ttd_transformed') }}"
    tables:
      - name: ttd

  - name: cm360_transformed
    database: "{{ env_var('DBT_BIGQUERY_PROJECT', 'public-trust-main') }}"
    schema: "{{ env_var('REFERENCE_CM360_TRANSFORMED_BIGQUERY_DATASET', 'cm360_transformed') }}"
    tables:
      - name: cm360_direct_buy
  - name: dv360_transformed
    database: "{{ env_var('DBT_BIGQUERY_PROJECT', 'public-trust-main') }}"
    schema: "{{ env_var('REFERENCE_DV360_TRANSFORMED_BIGQUERY_DATASET', 'dv360_transformed') }}"
    tables:
      - name: dv360_standard
      - name: dv360_youtube

  - name: google_ads
    database: "{{ env_var('DBT_BIGQUERY_PROJECT', 'public-trust-main') }}"
    schema: "{{ env_var('REFERENCE_GOOGLE_ADS_TRANSFORMED_BIGQUERY_DATASET', 'google_ads_search_transformed') }}"
    tables:
      - name: google_ads_demand
      - name: google_ads_search
      - name: google_ads_demand_2

  - name: dash_table_search
    database: "{{ env_var('DBT_BIGQUERY_PROJECT', 'public-trust-main') }}"
    schema: "{{ env_var('REFERENCE_DASH_TABLE_SEARCH_BIGQUERY_DATASET', 'dash_table_search') }}"
    tables:
      - name: dash_table_search
  - name: dash_table
    database: "{{ env_var('DBT_BIGQUERY_PROJECT', 'public-trust-main') }}"
    schema: "{{ env_var('REFERENCE_DASH_UNION_BIGQUERY_DATASET', 'dash_table') }}"
    tables:
      - name: dash_table
  
  - name: dash_union
    database: "{{ env_var('DBT_BIGQUERY_PROJECT', 'public-trust-main') }}"
    schema: "{{ env_var('REFERENCE_DASH_UNION_BIGQUERY_DATASET', 'dash_union') }}"
    tables:
      - name: dash_union


  - name: ga4_session_transformed
    database: "{{ env_var('DBT_BIGQUERY_PROJECT', 'public-trust-main') }}"
    schema: "{{ env_var('REFERENCE_GA4_SESSION_TRANSFORMED_BIGQUERY_DATASET', 'ga4_transformed') }}"
    tables:
      - name: ga4_goal_channel_session
  - name: ga4_goal_transformed
    database: "{{ env_var('DBT_BIGQUERY_PROJECT', 'public-trust-main') }}"
    schema: "{{ env_var('REFERENCE_GA4_GOAL_TRANSFORMED_BIGQUERY_DATASET', 'ga4_transformed') }}"
    tables:
      - name: ga4_goal_channel_goal


models:
  - name: facebook
    config:
      schema: "{{ env_var('META_SUFFIX', '') }}"
    columns:
      - name: media_cost
        tests:
          - testing_sum.expected_sum:
              expected_value: 14549.95
      - name: impressions
        tests:
          - testing_sum.expected_sum:
              expected_value: 2857616
      - name: clicks
        tests:
          - testing_sum.expected_sum:
              expected_value: 22450   
  - name: dv360_standard
    config:
      schema: "{{ env_var('DV360_SUFFIX', '') }}"
    columns:
      - name: media_cost
        tests:
          - testing_sum.expected_sum:
