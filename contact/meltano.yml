version: 1
default_environment: prod
project_id: 9581b380-7374-4cd8-a337-4f24fe125b2b
environments:
- name: dev
- name: staging
  config:
    plugins:
      transformers:
      - name: dbt-bigquery
        env:
          DBT_BIGQUERY_PROJECT: together-internal
          DBT_BIGQUERY_LOCATION: australia-southeast1
          CM360_RAW_BIGQUERY_PROJECT: together-internal
          REFERENCE_META_BIGQUERY_DATASET: dbt_test_facebook
          REFERENCE_META_TRANSFORMED_BIGQUERY_DATASET: dbt_test_facebook
          REFERENCE_DV360_BIGQUERY_DATASET: dbt_test_dv360_raw
          REFERENCE_DV360_TRANSFORMED_BIGQUERY_DATASET: dbt_test_dv360
          REFERENCE_TIKTOK_BIGQUERY_DATASET: dbt_test_tiktok
          REFERENCE_TIKTOK_TRANSFORMED_BIGQUERY_DATASET: dbt_test_tiktok
          REFERENCE_TTD_BIGQUERY_DATASET: dbt_test_ttd
          REFERENCE_TTD_TRANSFORMED_BIGQUERY_DATASET: dbt_test_ttd
          REFERENCE_HIVESTACK_BIGQUERY_DATASET: dbt_test_hivestack
          REFERENCE_HIVESTACK_TRANSFORMED_BIGQUERY_DATASET: dbt_test_hivestack
          REFERENCE_CM360_BIGQUERY_DATASET: dbt_test_cm360
          REFERENCE_CM360_TRANSFORMED_BIGQUERY_DATASET: dbt_test_cm360
          REFERENCE_GOOGLE_ADS_CENTRAL_BIGQUERY_DATASET: dbt_test_google_ads_search
          GOOGLE_ADS_SEARCH_SUFFIX__MOBILE: dbt_test_google_ads_search__mobile
          GOOGLE_ADS_SEARCH_SUFFIX__BROADBAND: dbt_test_google_ads_search__broadband
          GOOGLE_ADS_SEARCH_SUFFIX__ENERGY: dbt_test_google_ads_search__energy
          REFERENCE_GA4_RAW_BIGQUERY_DATASET: dbt_test_ga4_raw
          REFERENCE_GA4_TRANSFORMED_BIGQUERY_DATASET: dbt_test_ga4_transformed
          REFERENCE_GA4_CENTRAL_BIGQUERY_DATASET: dbt_test_ga4_transformed
          REFERENCE_DASH_TABLE_BIGQUERY_DATASET: dbt_test_dash_table
          REFERENCE_DASH_SEARCH_BIGQUERY_DATASET: dbt_test_dash_table_search
          META_SUFFIX: dbt_test_facebook
          DV360_SUFFIX: dbt_test_dv360
          TIKTOK_SUFFIX: dbt_test_tiktok
          TTD_SUFFIX: dbt_test_ttd
          HIVESTACK_SUFFIX: dbt_test_hivestack
          CM360_SUFFIX: dbt_test_cm360
          PLAN_CODE: con
          REPORT_NAME: amp_report
- name: prod
#state_backend:
#  uri: gs://contact-main-meltano-state-staging
plugins:
  extractors:
  - name: tap-hivestack
    namespace: tap-hivestack
    pip_url: git+ssh://git@github.com/Together-NZ/tap-hivestack.git setuptools<82.0
    executable: tap-hivestack
    config:
        api_key: ${TAP_HIVESTACK_API_KEY}
        report_id: '82075' 
  - name: tap-ttd
    namespace: tap-ttd
    pip_url: git+https://github.com/Together-NZ/tap-ttd.git setuptools<82.0
    executable: tap-ttd
    config:
      api_key: ${TAP_TTD_API_KEY}
      start_date: ${START_DATE}
      end_date: 
      manual: false
      advertiser_id: fsuopvg
  - name: tap-ga4
    variant: meltanolabs
    pip_url: git+https://github.com/MeltanoLabs/tap-google-analytics.git setuptools<82.0
    config:
      reports: ${TAP_GA4_REPORTS}
      start_date: ${START_DATE}
      keep_empty_rows: true
      select:
      - ${GA4_GOAL}
  - name: tap-dv360
    namespace: tap-dv360
    pip_url: git+https://github.com/Together-NZ/tap-dv360.git setuptools<82.0
    executable: tap-dv360
    capabilities:
    - state
    - catalog
    - discover
    - about
    - stream-maps
    config:
      start_date: ${START_DATE}
      advertiser_id: '7337697838'
      query_standard: dv360_standard.json
      query_youtube: dv360_youtube.json
      service_account: together-meltano@together-internal.iam.gserviceaccount.com
  - name: tap-tiktok
    variant: gthesheep
    pip_url: git+https://github.com/gthesheep/tap-tiktok.git setuptools<82.0
    config:
      start_date: ${START_DATE}
  - name: tap-facebook
    variant: airbyte
    pip_url: git+https://github.com/MeltanoLabs/tap-airbyte-wrapper.git setuptools<82.0
    config:
      airbyte_config:
        start_date: ${START_DATE}T00:00:00Z
    select:
    - ads_insights.*
    - ad_account.*
    - ad_sets.*
    - ads.*
    - campaigns.*
    - custom_conversions.*
  loaders:
  - name: target-bigquery
    variant: z3z1ma
    pip_url: git+https://github.com/z3z1ma/target-bigquery.git setuptools<82.0
    config:
      dataset: ${BQ_DATASET}
      project: contact-energy-main
      location: australia-southeast1
      denormalized: false
      schema_resolver_version: 2
      column_name_transforms:
        add_underscore_when_invalid: true
        lower: true
        snake_case: true
      fail_fast: false
      method: ${BQ_METHOD}
      bucket: australia-southeast1-meltan-00c049c-bigquery-staging
  orchestrators:
  - name: airflow
    variant: apache
    pip_url: apache-airflow==2.10.5 --constraint https://raw.githubusercontent.com/apache/airflow/constraints-2.10.5/constraints-${MELTANO__PYTHON_VERSION}.txt
  transformers:
  - name: dbt-bigquery
    variant: dbt-labs
    pip_url: dbt-core~=1.8.0 dbt-bigquery~=1.8.0 setuptools<82.0
    commands:
      google_ads_models:
        args: run --select google_ads_search google_ads_demand google_ads_keyword google_ads_location bing_ads_search bing_ads_search_keyword
      google_ads_mobile_models:
        args: run --select google_ads_location__mobile google_ads_keyword__mobile bing_ads_search_keyword__mobile
      google_ads_broadband_models:
        args: run --select google_ads_location__broadband google_ads_keyword__broadband bing_ads_search_keyword__broadband
      google_ads_energy_models:
        args: run --select google_ads_location__energy google_ads_keyword__energy bing_ads_search_keyword__energy
      ga4_goal_models:
        args: run --select +ga4_goal_a +ga4_goal_channel_goal
      ga4_session_models:
        args: run --select +ga4_goal_a_session +ga4_goal_channel_session
      ga4_mobile_keyword_models:
        args: run --select ga4_goal_channel_keyword__mobile
      ga4_broadband_keyword_models:
        args: run --select ga4_goal_channel_keyword__broadband
      ga4_energy_keyword_models:
        args: run --select ga4_goal_channel_keyword__energy
      ga4_keyword_models:
        args: run --select ga4_goal_channel_keyword
      ga4_mobile_ecommerce_models:
        args: run --select ga4_goal_ecommerce__mobile
      ga4_broadband_ecommerce_models:
        args: run --select ga4_goal_ecommerce__broadband
      ga4_energy_ecommerce_models:
        args: run --select ga4_goal_ecommerce__energy
      ga4_ecommerce_models:
        args: run --select ga4_goal_ecommerce
      ga4_mobile_final_models:
        args: run --select ga4_goal_channel__mobile
      ga4_broadband_final_models:
        args: run --select ga4_goal_channel__broadband
      ga4_energy_final_models:
        args: run --select ga4_goal_channel__energy
      ga4_final_models:
        args: run --select ga4_goal_channel
      cm360_models:
        args: run --select cm360_seralized cm360_direct_buy
      dv360_models:
        args: run --select dv360_standard dv360_youtube
      facebook_models:
        args: run --select facebook
      tiktok_models:
        args: run --select tiktok
      hivestack_models:
        args: run --select hivestack
      ttd_models:
        args: run --select ttd
      dash_models:
        args: run --select dash_table
      dash_search_models:
        args: run --select dash_table_search
      dash_union_models:
        args: run --select dash_union
      dash_union_mobile_models:
        args: run --select dash_union__mobile
      dash_union_broadband_models:
        args: run --select dash_union__broadband
      dash_union_energy_models:
        args: run --select dash_union__energy
  files:
  - name: files-airflow
    variant: meltano
    pip_url: git+https://github.com/meltano/files-airflow.git
