version: 1
default_environment: dev
project_id: 4f5340fe-b63b-41b8-8b8a-963749a65dc3
environments:
- name: dev
- name: staging
  config:
    plugins:
      transformers:
      - name: dbt-bigquery
        env:
          DBT_BIGQUERY_PROJECT: together-internal
          DBT_BIGQUERY_LOCATION: australia-southeast1
          DBT_BIGQUERY_AUTH_METHOD: oauth
          REFERENCE_META_BIGQUERY_DATASET: dbt_test_facebook
          REFERENCE_META_TRANSFORMED_BIGQUERY_DATASET: dbt_test_facebook
          REFERENCE_LINKEDIN_BIGQUERY_DATASET: dbt_test_linkedin
          REFERENCE_LINKEDIN_TRANSFORMED_BIGQUERY_DATASET: dbt_test_linkedin
          REFERENCE_HIVESTACK_BIGQUERY_DATASET: dbt_test_hivestack
          REFERENCE_HIVESTACK_TRANSFORMED_BIGQUERY_DATASET: dbt_test_hivestack
          REFERENCE_TTD_BIGQUERY_DATASET: dbt_test_ttd
          REFERENCE_TTD_TRANSFORMED_BIGQUERY_DATASET: dbt_test_ttd
          REFERENCE_CM360_TRANSFORMED_BIGQUERY_DATASET: dbt_test_cm360
          REFERENCE_GA4_RAW_BIGQUERY_DATASET: dbt_test_ga4_raw
          REFERENCE_GA4_SESSION_TRANSFORMED_BIGQUERY_DATASET: dbt_test_ga4_transformed
          REFERENCE_GA4_GOAL_TRANSFORMED_BIGQUERY_DATASET: dbt_test_ga4_transformed
          REFERENCE_GOOGLE_ADS_SEARCH_TRANSFORMED_BIGQUERY_DATASET: dbt_test_google_ads_search
          REFERENCE_DASH_UNION_BIGQUERY_DATASET: dbt_test_dash_table
          REFERENCE_DASH_UNION_SEARCH_BIGQUERY_DATASET: dbt_test_dash_table_search
          META_SUFFIX: dbt_test_facebook
          LINKEDIN_SUFFIX: dbt_test_linkedin
          HIVESTACK_SUFFIX: dbt_test_hivestack
          TTD_SUFFIX: dbt_test_ttd
          GOOGLE_ADS_SEARCH_SUFFIX: dbt_test_google_ads_search
          REPORT_NAME: amp_report
          PLAN_CODE: uow
          PLAN_CODE_GA4: uow
          CM360_DIRECT_BUY_TABLE: cm360_direct_buy
- name: prod
#state_backend:
#  uri: gs://geely-meltano-state-staging
plugins:
  extractors:
  - name: tap-linkedin-ads
    namespace: tap-linkedin-ads
    pip_url: git+https://github.com/Together-NZ/tap-linkedin.git setuptools<82.0
    executable: tap-linkedin-ads
    capabilities:
    - state
    - catalog
    - discover
    - about
    - stream-maps
    config:
      access_token: ${TAP_LINKEDIN_ADS_ACCESS_TOKEN}
      refresh_token: ${TAP_LINKEDIN_ADS_REFRESH_TOKEN}
      client_id: ${TAP_LINKEDIN_ADS_CLIENT_ID}
      client_secret: ${TAP_LINKEDIN_ADS_CLIENT_SECRET}
      accounts: ${TAP_LINKEDIN_ADS_ACCOUNTS}
      user_agent: agent
      start_date: ${START_DATE}
      _catalog_path: ./catalog.json
    select:
      - campaigns.*
      - creatives.*
      - campaign_groups.*
      - ad_analytics_by_creative.*
  - name: tap-ga4
    variant: meltanolabs
    pip_url: git+https://github.com/MeltanoLabs/tap-google-analytics.git setuptools<82.0
    config:
      reports: ${TAP_GA4_REPORTS}
      start_date: ${START_DATE}
      keep_empty_rows: true
      select:
      - ${GA4_GOAL}
  - name: tap-ttd
    namespace: tap-ttd
    pip_url: git+https://github.com/Together-NZ/tap-ttd.git setuptools<82.0
    executable: tap-ttd
    config:
      api_key: ${TAP_TTD_API_KEY}
      start_date: ${START_DATE}
      end_date:
      manual: false
      advertiser_id: ${TAP_TTD_ADVERTISER_ID}
  - name: tap-hivestack
    namespace: tap-hivestack
    pip_url: git+ssh://git@github.com/Together-NZ/tap-hivestack.git setuptools<82.0
    executable: tap-hivestack
    config:
        api_key: ${TAP_HIVESTACK_API_KEY}
        report_id: '84171'
  - name: tap-facebook
    variant: airbyte
    pip_url: git+https://github.com/MeltanoLabs/tap-airbyte-wrapper.git setuptools<82.0
    config:
      airbyte_config:
        start_date: ${START_DATE}T00:00:00Z
    select:
    - ads_insights.*
    - ad_account.*
    - ad_sets.*
    - ads.*
    - campaigns.*
    - custom_conversions.*
  - name: tap-gpt
    namespace: tap-gpt
    pip_url: git+https://github.com/Together-NZ/tap-gpt.git setuptools<82.0
    executable: tap-gpt
    capabilities:
    - state
    - catalog
    - discover
    - about
    - stream-maps
    config:
      api_token: ${TAP_GPT_API_TOKEN}
      start_date: ${START_DATE}
      end_date: ${TAP_GPT_END_DATE}
  loaders:
  - name: target-jsonl
    variant: andyh1203
    pip_url: target-jsonl
  - name: target-bigquery
    variant: z3z1ma
    pip_url: git+https://github.com/z3z1ma/target-bigquery.git setuptools<82.0
    config:
      dataset: ${BQ_DATASET}
      project: geely-main
      location: australia-southeast1
      denormalized: false
      schema_resolver_version: 2
      column_name_transforms:
        add_underscore_when_invalid: true
        lower: true
        snake_case: true
      fail_fast: false
      method: ${BQ_METHOD}
      bucket: australia-southeast1-meltan-00c049c-bigquery-staging
  orchestrators:
  - name: airflow
    variant: apache
    pip_url: apache-airflow==2.10.5 --constraint
      https://raw.githubusercontent.com/apache/airflow/constraints-2.10.5/constraints-${MELTANO__PYTHON_VERSION}.txt
  transformers:
  - name: dbt-bigquery
    variant: dbt-labs
    pip_url: dbt-core~=1.9.2 dbt-bigquery~=1.9.1 setuptools<82.0
    commands:
      gpt_geely_models:
        args: run --select gpt__geely
      ttd_geely_models:
        args: run --select +ttd__geely
      ttd_lotus_models:
        args: run --select +ttd__lotus
      facebook_geely_models:
        args: run --select +facebook__geely
      ga4_geely_goal_models:
        args: run --select +ga4_goal_a__geely +ga4_goal_channel_goal__geely
      ga4_lotus_goal_models:
        args: run --select +ga4_goal_a__lotus +ga4_goal_channel_goal__lotus
      ga4_geely_session_models:
        args: run --select +ga4_goal_a_session__geely +ga4_goal_channel_session__geely
      ga4_lotus_session_models:
        args: run --select +ga4_goal_a_session__lotus +ga4_goal_channel_session__lotus
      ga4_geely_keyword_models:
        args: run --select +ga4_goal_channel_keyword__geely
      ga4_lotus_keyword_models:
        args: run --select +ga4_goal_channel_keyword__lotus
      ga4_geely_final_models:
        args: run --select ga4_goal_channel__geely
      ga4_lotus_final_models:
        args: run --select ga4_goal_channel__lotus
      cm360_geely_models:
        args: run --select +cm360_seralized__geely +cm360_direct_buy__geely
      cm360_lotus_models:
        args: run --select +cm360_seralized__lotus +cm360_direct_buy__lotus
      google_ads_geely_models:
        args: run --select +google_ads_search__geely +google_ads_demand__geely +google_ads_keyword__geely +google_ads_location__geely
      linkedin_geely_models:
        args: run --select +linkedin__geely
      linkedin_lotus_models:
        args: run --select +linkedin__lotus
      hivestack_lotus_models:
        args: run --select +hivestack__lotus
    config:
      project: geely-main
      location: australia-southeast1
      method: oauth
  files:
  - name: files-airflow
    variant: meltano
    pip_url: git+https://github.com/meltano/files-airflow.git
