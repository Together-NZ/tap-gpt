version: 1
default_environment: dev
project_id: kiwibank-meltano-project
environments:
- name: dev
- name: staging
  config:
    plugins:
      transformers:
      - name: dbt-bigquery
        env:
          DBT_BIGQUERY_PROJECT: together-internal
          DBT_BIGQUERY_LOCATION: australia-southeast1
          REFERENCE_META_BIGQUERY_DATASET: dbt_test_facebook
          REFERENCE_LINKEDIN_BIGQUERY_DATASET: dbt_test_linkedin
          REFERENCE_HIVESTACK_BIGQUERY_DATASET: dbt_test_hivestack
          REFERENCE_DV360_RAW_BIGQUERY_DATASET: dbt_test_dv360_raw
          REFERENCE_TIKTOK_BIGQUERY_DATASET: dbt_test_tiktok
          REFERENCE_CM360_TRANSFORMED_BIGQUERY_DATASET: dbt_test_cm360
          META_SUFFIX: dbt_test_facebook
          LINKEDIN_SUFFIX: dbt_test_linkedin
          HIVESTACK_SUFFIX: dbt_test_hivestack
          DV360_SUFFIX: dbt_test_dv360
          TIKTOK_SUFFIX: dbt_test_tiktok
          PLAN_CODE: uow
          REPORT_NAME: amp_report
- name: prod
plugins:
  extractors:
  - name: tap-facebook
    variant: airbyte
    pip_url: git+https://github.com/MeltanoLabs/tap-airbyte-wrapper.git setuptools<82.0
    config:
      airbyte_config:
        start_date: ${START_DATE}T00:00:00Z
    select:
    - ads_insights.*
    - ad_account.*
    - ad_sets.*
    - ads.*
    - campaigns.*
    - custom_conversions.*
  - name: tap-linkedin-ads
    namespace: tap-linkedin-ads
    pip_url: git+https://github.com/Together-NZ/tap-linkedin.git setuptools<82.0
    executable: tap-linkedin-ads
    capabilities:
    - state
    - catalog
    - discover
    - about
    - stream-maps
    config:
      access_token: ${TAP_LINKEDIN_ADS_ACCESS_TOKEN}
      refresh_token: ${TAP_LINKEDIN_ADS_REFRESH_TOKEN}
      client_id: ${TAP_LINKEDIN_ADS_CLIENT_ID}
      client_secret: ${TAP_LINKEDIN_ADS_CLIENT_SECRET}
      accounts: '519443423'
      user_agent: agent
      start_date: ${START_DATE}
      _catalog_path: ./catalog.json
    select:
    - campaigns.*
    - creatives.*
    - campaign_groups.*
    - ad_analytics_by_creative.*
  - name: tap-ga4
    variant: meltanolabs
    pip_url: git+https://github.com/MeltanoLabs/tap-google-analytics.git setuptools<82.0
    config:
      reports: ${GA4_REPORTS}
      start_date: ${START_DATE}
      keep_empty_rows: true
      select:
      - ${GA4_GOAL}
  - name: tap-ttd
    namespace: tap-ttd
    pip_url: git+https://github.com/Together-NZ/tap-ttd.git setuptools<82.0
    executable: tap-ttd
    config:
      api_key: ${TAP_TTD_API_KEY}
      start_date: ${START_DATE}
      end_date: ''
      manual: false
      advertiser_id: 'x9c1nns'
  - name: tap-dv360
    namespace: tap-dv360
    pip_url: git+https://github.com/Together-NZ/tap-dv360.git setuptools<82.0
    executable: tap-dv360
    capabilities:
    - state
    - catalog
    - discover
    - about
    - stream-maps
    config:
      start_date: ${START_DATE}
      advertiser_id: '8056209584'
      query_standard: dv360_standard.json
      query_youtube: dv360_youtube.json
      service_account: together-ias@together-internal.iam.gserviceaccount.com
  - name: tap-hivestack
    namespace: tap-hivestack
    pip_url: git+ssh://git@github.com/Together-NZ/tap-hivestack.git setuptools<82.0
    executable: tap-hivestack
    config:
      api_key: ${TAP_HIVESTACK_API_KEY}
      report_id: '93040'
  - name: tap-tiktok
    variant: gthesheep
    pip_url: git+https://github.com/gthesheep/tap-tiktok.git setuptools<82.0
    config:
      start_date: ${START_DATE}
  loaders:
  - name: target-jsonl
    variant: andyh1203
    pip_url: target-jsonl
  - name: target-bigquery
    variant: z3z1ma
    pip_url: git+https://github.com/z3z1ma/target-bigquery.git setuptools<82.0
    config:
      dataset: ${BQ_DATASET}
      project: kiwibank-main
      location: australia-southeast1
      denormalized: false
      schema_resolver_version: 2
      column_name_transforms:
        add_underscore_when_invalid: true
        lower: true
        snake_case: true
      fail_fast: false
      method: ${BQ_METHOD}
      bucket: australia-southeast1-meltan-00c049c-bigquery-staging
  orchestrators:
  - name: airflow
    variant: apache
    pip_url: apache-airflow==2.10.5 --constraint
      https://raw.githubusercontent.com/apache/airflow/constraints-2.10.5/constraints-${MELTANO__PYTHON_VERSION}.txt
  transformers:
  - name: dbt-bigquery
    variant: dbt-labs
    pip_url: dbt-core~=1.9.2 dbt-bigquery~=1.9.1 setuptools<82.0
    config:
      project: kiwibank-main
      location: australia-southeast1
      method: oauth
    commands:
      cm360_models:
        args: run --select +cm360_direct_buy +cm360_direct_buy_no_dv360
      facebook_models:
        args: run --select +facebook
      linkedin_models:
        args: run --select +linkedin
      dv360_models:
        args: run --select +dv360_standard +dv360_youtube
      hivestack_models:
        args: run --select +hivestack
      tiktok_models:
        args: run --select +tiktok
      ga4_goal_models:
        args: run --select +ga4_goal_a +ga4_goal_channel_goal
      ga4_session_models:
        args: run --select +ga4_goal_a_session +ga4_goal_channel_session
      ga4_final_models:
        args: run --select ga4_goal_channel
      ga4_keyword_models:
        args: run --select ga4_goal_a_keyword +ga4_goal_channel_keyword
      ga4_keyword_ao_social_boosting_models:
        args: run --select ga4_goal_channel_keyword__ao_social_boosting
      ga4_keyword_business_banking_models:
        args: run --select ga4_goal_channel_keyword__business_banking
      ga4_keyword_credit_card_models:
        args: run --select ga4_goal_channel_keyword__credit_card
      ga4_keyword_fraud_and_scams_models:
        args: run --select ga4_goal_channel_keyword__fraud_and_scams
      ga4_keyword_everyday_banking_join_kiwibank_models:
        args: run --select ga4_goal_channel_keyword__everyday_banking_join_kiwibank
      ga4_keyword_everyday_banking_retail_deposit_models:
        args: run --select ga4_goal_channel_keyword__everyday_banking_retail_deposit
      ga4_keyword_home_loans_models:
        args: run --select ga4_goal_channel_keyword__home_loans
      ga4_keyword_customer_business_models:
        args: run --select ga4_goal_channel_keyword__customer_business
      ga4_keyword_generic_models:
        args: run --select ga4_goal_channel_keyword__generic
      ga4_keyword_unattributed_models:
        args: run --select ga4_goal_channel_keyword__unattributed
      ga4_ao_social_boosting_models:
        args: run --select ga4_goal_channel__ao_social_boosting
      ga4_business_banking_models:
        args: run --select ga4_goal_channel__business_banking
      ga4_customer_business_models:
        args: run --select ga4_goal_channel__customer_business
      ga4_credit_card_models:
        args: run --select ga4_goal_channel__credit_card
      ga4_fraud_and_scams_models:
        args: run --select ga4_goal_channel__fraud_and_scams
      ga4_everyday_banking_join_kiwibank_models:
        args: run --select ga4_goal_channel__everyday_banking_join_kiwibank
      ga4_everyday_banking_retail_deposit_models:
        args: run --select ga4_goal_channel__everyday_banking_retail_deposit
      ga4_home_loans_models:
        args: run --select ga4_goal_channel__home_loans
      ga4_unattributed_models:
        args: run --select ga4_goal_channel__unattributed
      ga4_generic_models:
        args: run --select ga4_goal_channel__generic
      dash_customer_business_models:
        args: run --select dash_table__customer_business
      dash_customer_business_union_models:
        args: run --select dash_union__customer_business
      dash_generic_models:
        args: run --select dash_table__generic
      dash_generic_union_models:
        args: run --select dash_union__generic
      google_ads_ao_social_boosting_models:
        args: run --select google_ads_search__ao_social_boosting google_ads_demand__ao_social_boosting
      google_ads_everyday_banking_retail_deposit_models:
        args: run --select +google_ads_search__everyday_banking_retail_deposit1 +google_ads_demand__everyday_banking_retail_deposit1 +google_ads_search__everyday_banking_retail_deposit2 +google_ads_demand__everyday_banking_retail_deposit2 +google_ads_keyword__everyday_banking_retail_deposit +google_ads_location__everyday_banking_retail_deposit
      google_ads_credit_card_models:
        args: run --select +google_ads_search__credit_card +google_ads_demand__credit_card +google_ads_keyword__credit_card +google_ads_location__credit_card
      google_ads_fraud_and_scams_models:
        args: run --select +google_ads_search__fraud_and_scams +google_ads_demand__fraud_and_scams +google_ads_keyword__fraud_and_scams +google_ads_location__fraud_and_scams
      google_ads_everyday_banking_join_kiwibank_models:
        args: run --select +google_ads_search__everyday_banking_join_kiwibank +google_ads_demand__everyday_banking_join_kiwibank +google_ads_keyword__everyday_banking_join_kiwibank +google_ads_location__everyday_banking_join_kiwibank
      google_ads_business_banking_models:
        args: run --select +google_ads_search__business_banking +google_ads_demand__business_banking +google_ads_keyword__business_banking +google_ads_location__business_banking
      google_ads_home_loans_models:
        args: run --select +google_ads_search__home_loans +google_ads_demand__home_loans +google_ads_keyword__home_loans +google_ads_location__home_loans
      google_ads_unattributed_models:
        args: run --select +google_ads_search__unattributed +google_ads_demand__unattributed
      google_ads_generic_models:
        args: run --select +google_ads_search__generic +google_ads_demand__generic +google_ads_keyword__generic
      bing_ads_home_loans_models:
        args: run --select +bing_ads_search__home_loans +bing_ads_search_keyword__home_loans
      bing_ads_everyday_banking_retail_deposit_models:
        args: run --select +bing_ads_search__everyday_banking_retail_deposit +bing_ads_search_keyword__everyday_banking_retail_deposit
      ttd_models:
        args: run --select +ttd
  files:
  - name: files-airflow
    variant: meltano
    pip_url: git+https://github.com/meltano/files-airflow.git
