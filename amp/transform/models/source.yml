version: 2

# AMP BigQuery layout. Defaults match `amp-main.*`.
# Override with DBT_BIGQUERY_PROJECT and REFERENCE_* env vars per environment.
# Adobe / GA4 goal-channel brand models are left as-is (Adobe path).

models:
  - name: reddit
    config:
      schema: "{{ env_var('REDDIT_SUFFIX', '') }}"
    columns:
      - name: media_cost
        tests:
          - testing_sum.expected_sum:
              expected_value: 1095.76
      - name: impressions
        tests:
          - testing_sum.expected_sum:
              expected_value: 429635
      - name: clicks
        tests:
          - testing_sum.expected_sum:
              expected_value: 1268

  - name: ttd_transformed
    config:
      schema: "{{ env_var('TTD_SUFFIX', '') }}"
    columns:
      - name: media_cost
        tests:
          - testing_sum.expected_sum:
              expected_value: 52112.58
      - name: impressions
        tests:
          - testing_sum.expected_sum:
              expected_value: 798906
      - name: clicks
        tests:
          - testing_sum.expected_sum:
              expected_value: 363

  - name: facebook
    config:
      schema: "{{ env_var('META_SUFFIX', '') }}"
    columns:
      - name: media_cost
        tests:
          - testing_sum.expected_sum:
              expected_value: 14549.95
      - name: impressions
        tests:
          - testing_sum.expected_sum:
              expected_value: 2857616
      - name: clicks
        tests:
          - testing_sum.expected_sum:
              expected_value: 22450

  - name: dv360_standard
    config:
      schema: "{{ env_var('DV360_SUFFIX', '') }}"
    columns:
      - name: media_cost
        tests:
          - testing_sum.expected_sum:
              expected_value: 68223.08
      - name: impressions
        tests:
          - testing_sum.expected_sum:
              expected_value: 5840202
      - name: clicks
        tests:
          - testing_sum.expected_sum:
              expected_value: 7786

  - name: dv360_youtube
    config:
      schema: "{{ env_var('DV360_SUFFIX', '') }}"
    columns:
      - name: media_cost
        tests:
          - testing_sum.expected_sum:
              expected_value: 67127.98
      - name: impressions
        tests:
          - testing_sum.expected_sum:
              expected_value: 5248537
      - name: clicks
        tests:
          - testing_sum.expected_sum:
              expected_value: 4432



  - name: linkedin
    config:
      schema: "{{ env_var('LINKEDIN_SUFFIX', '') }}"
    columns:
      - name: media_cost
        tests:
          - testing_sum.expected_sum:
              expected_value: 8327.91
      - name: impressions
        tests:
          - testing_sum.expected_sum:
              expected_value: 771281
      - name: clicks
        tests:
          - testing_sum.expected_sum:
              expected_value: 5785

  - name: hivestack
    config:
      schema: "{{ env_var('HIVESTACK_SUFFIX', '') }}"
    columns:
      - name: media_cost
        tests:
          - testing_sum.expected_sum:
              expected_value: 15000.03
      - name: impressions
        tests:
          - testing_sum.expected_sum:
              expected_value: 815604.65
      - name: clicks
        tests:
          - testing_sum.expected_sum:
              expected_value: 0

sources:
  - name: reddit_raw
    database: "{{ env_var('DBT_BIGQUERY_PROJECT', 'amp-main') }}"
    schema: "{{ env_var('REFERENCE_REDDIT_BIGQUERY_DATASET', 'reddit_raw') }}"
    tables:
      - name: ads
      - name: campaigns
      - name: reports

  - name: reddit_transformed
    database: "{{ env_var('DBT_BIGQUERY_PROJECT', 'amp-main') }}"
    schema: "{{ env_var('REFERENCE_REDDIT_TRANSFORMED_BIGQUERY_DATASET', 'reddit_transformed') }}"
    tables:
      - name: reddit

  - name: facebook_raw
    database: "{{ env_var('DBT_BIGQUERY_PROJECT', 'amp-main') }}"
    schema: "{{ env_var('REFERENCE_META_BIGQUERY_DATASET', 'facebook_raw') }}"
    tables:
      - name: ads_insights
      - name: ad_sets
      - name: ads
      - name: campaigns
      - name: custom_conversions

  - name: facebook_transformed
    database: "{{ env_var('DBT_BIGQUERY_PROJECT', 'amp-main') }}"
    schema: "{{ env_var('REFERENCE_META_TRANSFORMED_BIGQUERY_DATASET', 'facebook_transformed') }}"
    tables:
      - name: facebook

  - name: dv360_raw
    database: "{{ env_var('DBT_BIGQUERY_PROJECT', 'amp-main') }}"
    schema: "{{ env_var('REFERENCE_DV360_BIGQUERY_DATASET', 'dv360_raw') }}"
    tables:
      - name: dv360_standard
      - name: dv360_youtube

  - name: dv360_transformed
    database: "{{ env_var('DBT_BIGQUERY_PROJECT', 'amp-main') }}"
    schema: "{{ env_var('REFERENCE_DV360_TRANSFORMED_BIGQUERY_DATASET', 'dv360_transformed') }}"
    tables:
      - name: dv360_standard
      - name: dv360_youtube

  - name: hivestack_raw
    database: "{{ env_var('DBT_BIGQUERY_PROJECT', 'amp-main') }}"
    schema: "{{ env_var('REFERENCE_HIVESTACK_BIGQUERY_DATASET', 'hivestack_raw') }}"
    tables:
      - name: amp_report

  - name: hivestack_transformed
    database: "{{ env_var('DBT_BIGQUERY_PROJECT', 'amp-main') }}"
    schema: "{{ env_var('REFERENCE_HIVESTACK_TRANSFORMED_BIGQUERY_DATASET', 'hivestack_transformed') }}"
    tables:
      - name: hivestack

  - name: linkedin_raw
    database: "{{ env_var('DBT_BIGQUERY_PROJECT', 'amp-main') }}"
    schema: "{{ env_var('REFERENCE_LINKEDIN_BIGQUERY_DATASET', 'linkedin_raw') }}"
    tables:
      - name: ad_analytics_by_creative
      - name: ad_analytics_by_campaign
      - name: creatives
      - name: campaigns
      - name: campaign_groups

  - name: linkedin_transformed
    database: "{{ env_var('DBT_BIGQUERY_PROJECT', 'amp-main') }}"
    schema: "{{ env_var('REFERENCE_LINKEDIN_TRANSFORMED_BIGQUERY_DATASET', 'linkedin_transformed') }}"
    tables:
      - name: linkedin

  - name: ttd_raw
    database: "{{ env_var('DBT_BIGQUERY_PROJECT', 'amp-main') }}"
    schema: "{{ env_var('REFERENCE_TTD_BIGQUERY_DATASET', 'ttd_raw') }}"
    tables:
      - name: standard_streams

  - name: ttd_transformed
    database: "{{ env_var('DBT_BIGQUERY_PROJECT', 'amp-main') }}"
    schema: "{{ env_var('REFERENCE_TTD_TRANSFORMED_BIGQUERY_DATASET', 'ttd_transformed') }}"
    tables:
      - name: ttd_transformed

  - name: cm360_raw
    database: "{{ env_var('CM360_RAW_BIGQUERY_PROJECT', 'together-internal') }}"
    schema: "{{ env_var('REFERENCE_CM360_BIGQUERY_DATASET', 'cm360_raw') }}"
    tables:
      - name: cm360_report_stream

  - name: cm360_transformed
    database: "{{ env_var('DBT_BIGQUERY_PROJECT', 'amp-main') }}"
    schema: "{{ env_var('REFERENCE_CM360_TRANSFORMED_BIGQUERY_DATASET', 'cm360_transformed') }}"
    tables:
      - name: cm360_direct_buy
      - name: cm360_seralized

  - name: google_ads
    database: "{{ env_var('DBT_BIGQUERY_PROJECT', 'amp-main') }}"
    schema: "{{ env_var('REFERENCE_GOOGLE_ADS_SEARCH_TRANSFORMED_BIGQUERY_DATASET', 'google_ads_search_transformed') }}"
    tables:
      - name: google_ads_demand
      - name: google_ads_search

  - name: dash_union
    database: "{{ env_var('DBT_BIGQUERY_PROJECT', 'amp-main') }}"
    schema: "{{ env_var('REFERENCE_DASH_UNION_BIGQUERY_DATASET', 'dash_table') }}"
    tables:
      - name: dash_table
      - name: dash_union__centralized

  - name: dash_union_search
    database: "{{ env_var('DBT_BIGQUERY_PROJECT', 'amp-main') }}"
    schema: "{{ env_var('REFERENCE_DASH_UNION_SEARCH_BIGQUERY_DATASET', 'dash_table_search') }}"
    tables:
      - name: dash_table_search
