default_environment: dev
project_id: warehouse-meltano-project
send_anonymous_usage_stats: false
environments:
  - name: dev
  - name: staging
    config:
      plugins:
        transformers:
          - name: dbt-bigquery
            env:
              DBT_BIGQUERY_PROJECT: together-internal
              DBT_BIGQUERY_LOCATION: australia-southeast1
              REFERENCE_META_BIGQUERY_DATASET: dbt_test_facebook
              REFERENCE_DV360_BIGQUERY_DATASET: dbt_test_dv360_raw
              META_SUFFIX: dbt_test_facebook
              DV360_SUFFIX: dbt_test_dv360
              REFERENCE_CM360_TRANSFORMED_BIGQUERY_DATASET: dbt_test_cm360
              CM360_SUFFIX: dbt_test_cm360
              REFERENCE_HIVESTACK_BIGQUERY_DATASET: dbt_test_hivestack
              HIVESTACK_SUFFIX: dbt_test_hivestack
              REFERENCE_TTD_RAW_BIGQUERY_DATASET: dbt_test_ttd_raw
              REFERENCE_TTD_TRANSFORMED_BIGQUERY_DATASET: dbt_test_ttd
              TTD_SUFFIX: dbt_test_ttd
              REFERENCE_SNAPCHAT_BIGQUERY_DATASET: dbt_test_snapchat
              REFERENCE_SNAPCHAT_TRANSFORMED_BIGQUERY_DATASET: dbt_test_snapchat
              SNAPCHAT_SUFFIX: dbt_test_snapchat
              REFERENCE_PINTEREST_BIGQUERY_DATASET: dbt_test_pinterest
              REFERENCE_PINTEREST_TRANSFORMED_BIGQUERY_DATASET: dbt_test_pinterest
              PINTEREST_SUFFIX: dbt_test_pinterest
              REFERENCE_TIKTOK_BIGQUERY_DATASET: dbt_test_tiktok
              REFERENCE_TIKTOK_TRANSFORMED_BIGQUERY_DATASET: dbt_test_tiktok
              TIKTOK_SUFFIX: dbt_test_tiktok
              REPORT_NAME: warehouse
              PLAN_CODE: twh
  - name: prod
plugins:
  extractors: 
  - name: tap-ga4
    variant: meltanolabs
    pip_url: git+https://github.com/MeltanoLabs/tap-google-analytics.git setuptools<82.0
    config:
      reports: ${TAP_GA4_REPORTS}
      start_date: ${START_DATE}
      keep_empty_rows: true
      select:
      - ${GA4_GOAL}
  - name: tap-dv360
    namespace: tap-dv360
    pip_url: git+https://github.com/Together-NZ/tap-dv360.git setuptools<82.0
    executable: tap-dv360
    capabilities:
    - state
    - catalog
    - discover
    - about
    - stream-maps
    config:
      start_date: ${START_DATE}
      advertiser_id: ${TAP_DV360_ADVERTISER_ID}
      query_standard: dv360_standard.json
      query_youtube: dv360_youtube.json
      service_account: together-meltano@together-internal.iam.gserviceaccount.com
  - name: tap-facebook
    variant: airbyte
    pip_url: git+https://github.com/MeltanoLabs/tap-airbyte-wrapper.git setuptools<82.0
    config:
      airbyte_config:
        start_date: ${START_DATE}T00:00:00Z
        account_id: ${TAP_FACEBOOK_AIRBYTE_CONFIG_ACCOUNT_ID}
    select:
    - ads_insights.*
    - ad_account.*
    - ad_sets.*
    - ads.*
    - campaigns.*
    - custom_conversions.*
  - name: tap-hivestack
    namespace: tap-hivestack
    pip_url: git+ssh://git@github.com/Together-NZ/tap-hivestack.git setuptools<82.0
    executable: tap-hivestack
    config:
      api_key: ${TAP_HIVESTACK_API_KEY}
      report_id: ${TAP_HIVESTACK_REPORT_ID}
  - name: tap-ttd
    namespace: tap-ttd
    pip_url: git+https://github.com/Together-NZ/tap-ttd.git setuptools<82.0
    executable: tap-ttd
    config:
      api_key: ${TAP_TTD_API_KEY}
      start_date: ${START_DATE}
      end_date:
      manual: false
      advertiser_id: ${TAP_TTD_ADVERTISER_ID}
  - name: tap-snapchat-ads
    namespace: tap-snapchat-ads
    pip_url: git+https://github.com/Together-NZ/tap_snapchat_ads.git setuptools<82.0
    executable: tap-snapchat-ads
    capabilities:
    - catalog
    config:
      client_id: ${TAP_SNAPCHAT_ADS_CLIENT_ID}
      client_secret: ${TAP_SNAPCHAT_ADS_CLIENT_SECRET}
      refresh_token: ${TAP_SNAPCHAT_ADS_REFRESH_TOKEN}
      start_date: ${START_DATE}T00:00:00Z
      user_agent: Meltano
      org_account_ids: ${TAP_SNAPCHAT_ADS_ORG_ACCOUNT_IDS}
      ad_account_ids: ${TAP_SNAPCHAT_ADS_AD_ACCOUNT_IDS}
    catalog: snapchat_catalog.json
  - name: tap-pinterest-ads
    namespace: tap-pinterest-ads
    pip_url: git+ssh://git@github.com/Together-NZ/tap-pinterest-ads.git setuptools<82.0
    config:
      client_id: ${PINTEREST_CLIENT_ID}
      client_secret: ${PINTEREST_CLIENT_SECRET}
      refresh_token: ${PINTEREST_REFRESH_TOKEN}
      ad_account_id: ${AD_ACCOUNT_ID}
      start_date: ${START_DATE}
      end_date: ${END_DATE}
  - name: tap-tiktok
    variant: gthesheep
    pip_url: git+https://github.com/gthesheep/tap-tiktok.git setuptools<82.0
    config:
      start_date: ${START_DATE}
      advertiser_id: ${TAP_TIKTOK_ADVERTISER_ID}
  loaders:
    - name: target-bigquery
      variant: z3z1ma
      pip_url: git+https://github.com/z3z1ma/target-bigquery.git setuptools<82.0
      config:
        dataset: ${BQ_DATASET}
        project: warehouse-main
        location: australia-southeast1
        denormalized: false
        schema_resolver_version: 2
        column_name_transforms:
          add_underscore_when_invalid: true
          lower: true
          snake_case: true
        fail_fast: false
        method: ${BQ_METHOD}
        bucket: australia-southeast1-meltan-00c049c-bigquery-staging
  orchestrators:
    - name: airflow
      variant: apache
      pip_url: apache-airflow==2.10.5 --constraint https://raw.githubusercontent.com/apache/airflow/constraints-2.10.5/constraints-${MELTANO__PYTHON_VERSION}.txt
  transformers:
  - name: dbt-bigquery
    variant: dbt-labs
    pip_url: dbt-core~=1.9.2 dbt-bigquery~=1.9.1 setuptools<82.0
    config:
      project: warehouse-main
      location: australia-southeast1
      method: oauth
    commands:
      facebook_twh_models:
        args: run --select facebook__twh
      facebook_twhs_models:
        args: run --select facebook__twhs
      cm360_twh_models:
        args: run --select cm360_direct_buy__twh
      cm360_twhs_models:
        args: run --select cm360_direct_buy__twhs
      dv360_twh_models:
        args: run --select dv360_standard__twh dv360_youtube__twh
      dv360_twhs_models:
        args: run --select dv360_standard__twhs dv360_youtube__twhs
      hivestack_twh_models:
        args: run --select hivestack__twh
      ttd_twh_models:
        args: run --select +ttd_transformed__twh
      snapchat_twh_models:
        args: run --select +snapchat__twh
      snapchat_twhs_models:
        args: run --select +snapchat__twhs
      pinterest_twh_models:
        args: run --select +pinterest__twh
      pinterest_twhs_models:
        args: run --select +pinterest__twhs
      tiktok_twh_models:
        args: run --select +tiktok__twh
      tiktok_twhs_models:
        args: run --select +tiktok__twhs
      google_ads_twh_models:
        args: run --select +google_ads_search__twh +google_ads_demand__twh +google_ads_keyword__twh +google_ads_location__twh +bing_ads_search__twh
      google_ads_twhs_models:
        args: run --select +google_ads_search__twhs +google_ads_demand__twhs +google_ads_keyword__twhs +google_ads_location__twhs +bing_ads_search__twhs
      bing_ads_twh_models:
        args: run --select bing_ads_search__twh bing_ads_keyword__twh
      bing_ads_twhs_models:
        args: run --select bing_ads_search__twhs bing_ads_keyword__twhs
      ga4_twh_goal_models:
        args: run --select ga4_goal_a__twh ga4_goal_channel_goal__twh
      ga4_twhs_goal_models:
        args: run --select ga4_goal_a__twhs ga4_goal_channel_goal__twhs
      ga4_twh_session_models:
        args: run --select ga4_goal_a_session__twh ga4_goal_channel_session__twh
      ga4_twhs_session_models:
        args: run --select ga4_goal_a_session__twhs ga4_goal_channel_session__twhs
      ga4_twh_keyword_models:
        args: run --select ga4_goal_channel_keyword__twh
      ga4_twhs_keyword_models:
        args: run --select ga4_goal_channel_keyword__twhs
      ga4_twh_ecommerce_models:
        args: run --select ga4_goal_ecommerce__twh
      ga4_twhs_ecommerce_models:
        args: run --select ga4_goal_ecommerce__twhs
      ga4_twh_final_models:
        args: run --select ga4_goal_channel__twh
      ga4_twhs_final_models:
        args: run --select ga4_goal_channel__twhs

  files:
    - name: files-airflow
      variant: meltano
      pip_url: git+https://github.com/meltano/files-airflow.git setuptools<82.0
elt:
  buffer_size: 52428800
